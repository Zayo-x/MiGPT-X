name: 构建并推送镜像

# 推 main 或打 tag 时自动构建，也可以在 Actions 页面手动触发
# 纯文档改动不触发构建 —— 镜像内容不会因为改 README 而变化
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，但 GitHub 用户名/仓库名可以有大写字母
      - name: 镜像名转小写
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 自带的构建缓存，第二次构建会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 只构建 x86_64。要在群晖/树莓派等 arm64 设备上跑，
          # 把下面这行改成 'linux/amd64,linux/arm64' 即可 ——
          # 但模拟构建会慢好几倍，建议先确认 amd64 构建通过再开。
          platforms: linux/amd64
